name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeqat-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Fixed signing and version
        run: |
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          sign='''android {
              signingConfigs {
                  debug {
                      storeFile file("../../meeqat.jks")
                      storePassword "meeqat123"
                      keyAlias "meeqat"
                      keyPassword "meeqat123"
                  }
              }'''
          s=s.replace('android {',sign,1)
          s=re.sub(r'versionCode\s+\d+','versionCode ${{ github.run_number }}',s,count=1)
          open(p,'w').write(s)
          PY
      - name: Build debug APK
        working-directory: meeqat-apk/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: meeqat-apk
          path: meeqat-apk/android/app/build/outputs/apk/debug/app-debug.apk
