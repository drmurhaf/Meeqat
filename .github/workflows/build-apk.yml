          cat > $D/AdhanService.java <<'JAVA_4'
          package com.murhaf.meeqat;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.content.res.AssetFileDescriptor;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.media.AudioAttributes;
          import android.media.MediaPlayer;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import android.provider.Settings;
          import androidx.core.app.NotificationCompat;

          public class AdhanService extends Service implements SensorEventListener {
              public static volatile boolean playing = false;
              public static volatile String curKey = "";
              public static volatile String curKind = "";
              private static final String CH = "meeqat_adhan";
              private static final int NID = 4711;
              private MediaPlayer mp;
              private PowerManager.WakeLock wl;
              private String pendTitle = null;
              private String pendBody = "";
              private int pendId = 0;
              private SensorManager sm;
              private boolean flipArmed = false;
              private long faceDownSince = 0;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              public static void stopNow(Context c) {
                  try {
                      Intent s = new Intent(c, AdhanService.class);
                      s.setAction("STOP");
                      c.startService(s);
                  } catch (Exception e) { }
              }

              private static String str(Intent i, String k) {
                  String v = i.getStringExtra(k);
                  return v == null ? "" : v;
              }

              @Override
              public int onStartCommand(Intent i, int flags, int startId) {
                  if (i != null && "STOP".equals(i.getAction())) {
                      stopAll();
                      return START_NOT_STICKY;
                  }
                  if (i == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  String key = str(i, "key");
                  String name = str(i, "name");
                  String sound = str(i, "sound");
                  String kind = str(i, "kind");
                  String sub = str(i, "sub");
                  String day = str(i, "day");
                  String title = str(i, "title");
                  String body = str(i, "body");
                  if (kind.isEmpty()) kind = "adhan";
                  if (title.isEmpty()) title = "حان وقت صلاة " + name;
                  boolean isAdhan = "adhan".equals(kind);

                  // an alert that was still active keeps its notification in the shade
                  if (pendTitle != null) {
                      AdhanNotif.post(this, pendId, pendTitle, pendBody);
                  }
                  pendTitle = title;
                  pendBody = body;
                  pendId = AdhanNotif.idFor(kind, key, day, sub);

                  makeChannel();
                  Intent open = new Intent(this, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  if (isAdhan) {
                      open.putExtra("adhan", true);
                      open.putExtra("key", key);
                  }
                  int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pi = PendingIntent.getActivity(this, 11, open, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                  Intent stop = new Intent(this, AdhanService.class);
                  stop.setAction("STOP");
                  PendingIntent sp = PendingIntent.getService(this, 12, stop, PendingIntent.FLAG_UPDATE_CURRENT | imm);

                  NotificationCompat.Builder nb = new NotificationCompat.Builder(this, CH)
                          .setSmallIcon(R.drawable.ic_stat_meeqat)
                          .setColor(0xFF0B5D49)
                          .setContentTitle(title)
                          .setContentText(body.isEmpty() ? "ميقات" : body)
                          .setCategory(NotificationCompat.CATEGORY_ALARM)
                          .setPriority(NotificationCompat.PRIORITY_MAX)
                          .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                          .setOngoing(true)
                          .setContentIntent(pi)
                          .addAction(0, "إيقاف الصوت", sp);
                  if (isAdhan) nb.setFullScreenIntent(pi, true);
                  Notification n = nb.build();
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK);
                      } else {
                          startForeground(NID, n);
                      }
                  } catch (Exception e) { }

                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (wl == null) wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "meeqat:adhan");
                      if (!wl.isHeld()) wl.acquire(15 * 60 * 1000L);
                  } catch (Exception e) { }

                  curKey = key;
                  curKind = kind;
                  play(sound);

                  if (isAdhan) {
                      try {
                          if (Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(this)) {
                              startActivity(open);
                          }
                      } catch (Exception e) { }
                  }
                  return START_NOT_STICKY;
              }

              private void makeChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm.getNotificationChannel(CH) == null) {
                          NotificationChannel ch = new NotificationChannel(CH, "الأذان", NotificationManager.IMPORTANCE_HIGH);
                          ch.setSound(null, null);
                          ch.enableVibration(true);
                          ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          nm.createNotificationChannel(ch);
                      }
                  }
              }

              private void play(String sound) {
                  stopPlayer();
                  try {
                      mp = new MediaPlayer();
                      mp.setAudioAttributes(new AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ALARM)
                              .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                              .build());
                      int res = 0;
                      if (sound.startsWith("a_") || sound.startsWith("p_")) {
                          res = getResources().getIdentifier(sound, "raw", getPackageName());
                      }
                      if (res != 0) {
                          AssetFileDescriptor afd = getResources().openRawResourceFd(res);
                          mp.setDataSource(afd.getFileDescriptor(), afd.getStartOffset(), afd.getLength());
                          afd.close();
                      } else {
                          Uri u = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                          mp.setDataSource(this, u);
                      }
                      mp.setOnCompletionListener(m -> stopAll());
                      mp.setOnErrorListener((m, what, extra) -> {
                          stopAll();
                          return true;
                      });
                      mp.prepare();
                      mp.start();
                      playing = true;
                      startFlip();
                  } catch (Exception e) {
                      stopAll();
                  }
              }

              /* flip the phone face-down to silence the adhan / alert tone */
              private boolean flipOn() {
                  try {
                      return getSharedPreferences(AdhanScheduler.PREF, Context.MODE_PRIVATE).getBoolean("flip", true);
                  } catch (Exception e) {
                      return true;
                  }
              }

              private void startFlip() {
                  try {
                      stopFlip();
                      if (!flipOn()) return;
                      sm = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                      Sensor acc = sm == null ? null : sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                      if (acc == null) return;
                      flipArmed = false;
                      faceDownSince = 0;
                      sm.registerListener(this, acc, SensorManager.SENSOR_DELAY_NORMAL);
                  } catch (Exception e) { }
              }

              private void stopFlip() {
                  try {
                      if (sm != null) sm.unregisterListener(this);
                  } catch (Exception e) { }
                  sm = null;
              }

              @Override
              public void onSensorChanged(SensorEvent e) {
                  float x = e.values[0];
                  float y = e.values[1];
                  float z = e.values[2];
                  boolean down = z < -7.0f && Math.abs(x) < 5.0f && Math.abs(y) < 5.0f;
                  if (!down) {
                      if (z > -4.0f) flipArmed = true;
                      faceDownSince = 0;
                      return;
                  }
                  if (!flipArmed) return;
                  long now = SystemClock.elapsedRealtime();
                  if (faceDownSince == 0) {
                      faceDownSince = now;
                  } else if (now - faceDownSince >= 350) {
                      stopAll();
                  }
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) { }

              private void stopPlayer() {
                  try {
                      if (mp != null) {
                          try { mp.stop(); } catch (Exception e) { }
                          mp.release();
                      }
                  } catch (Exception e) { }
                  mp = null;
              }

              private void stopAll() {
                  boolean wasAdhan = "adhan".equals(curKind);
                  stopFlip();
                  playing = false;
                  curKey = "";
                  curKind = "";
                  stopPlayer();
                  try {
                      if (wl != null && wl.isHeld()) wl.release();
                  } catch (Exception e) { }
                  try {
                      if (Build.VERSION.SDK_INT >= 24) {
                          stopForeground(Service.STOP_FOREGROUND_REMOVE);
                      } else {
                          stopForeground(true);
                      }
                  } catch (Exception e) { }
                  // leave a normal notification in the shade after the sound ends
                  if (pendTitle != null) {
                      AdhanNotif.post(this, pendId, pendTitle, pendBody);
                      pendTitle = null;
                  }
                  if (wasAdhan) MainActivity.releaseAdhanScreen();
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  stopFlip();
                  playing = false;
                  curKey = "";
                  curKind = "";
                  stopPlayer();
                  try {
                      if (wl != null && wl.isHeld()) wl.release();
                  } catch (Exception e) { }
                  super.onDestroy();
              }
          }
          JAVA_4
          cat > $D/AdhanPlugin.java <<'JAVA_5'
          package com.murhaf.meeqat;

          import android.Manifest;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import androidx.core.app.ActivityCompat;
          import androidx.core.app.NotificationManagerCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Adhan")
          public class AdhanPlugin extends Plugin {

              @PluginMethod
              public void schedule(PluginCall call) {
                  try {
                      JSArray items = call.getArray("items");
                      AdhanScheduler.save(getContext(), items == null ? "[]" : items.toString());
                      int n = AdhanScheduler.scheduleAll(getContext());
                      JSObject r = new JSObject();
                      r.put("scheduled", n);
                      r.put("exact", AdhanScheduler.canExact(getContext()));
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject(String.valueOf(e.getMessage()));
                  }
              }

              @PluginMethod
              public void setDone(PluginCall call) {
                  try {
                      JSArray keys = call.getArray("keys");
                      AdhanScheduler.setDone(getContext(), keys == null ? "[]" : keys.toString());
                  } catch (Exception e) { }
                  call.resolve();
              }

              @PluginMethod
              public void setOptions(PluginCall call) {
                  try {
                      Boolean flip = call.getBoolean("flip", true);
                      getContext().getSharedPreferences(AdhanScheduler.PREF, Context.MODE_PRIVATE)
                              .edit().putBoolean("flip", flip == null ? true : flip).apply();
                  } catch (Exception e) { }
                  call.resolve();
              }

              @PluginMethod
              public void showNotification(PluginCall call) {
                  String t = call.getString("title", "");
                  String b = call.getString("body", "");
                  int id = 6000 + Math.abs((t + "|" + b).hashCode() % 90000);
                  AdhanNotif.post(getContext(), id, t, b);
                  call.resolve();
              }

              @PluginMethod
              public void state(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("playing", AdhanService.playing && "adhan".equals(AdhanService.curKind));
                  r.put("key", AdhanService.curKey);
                  call.resolve(r);
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  AdhanService.stopNow(getContext());
                  call.resolve();
              }

              @PluginMethod
              public void status(PluginCall call) {
                  Context c = getContext();
                  JSObject r = new JSObject();
                  r.put("notif", NotificationManagerCompat.from(c).areNotificationsEnabled());
                  r.put("exact", AdhanScheduler.canExact(c));
                  r.put("overlay", Build.VERSION.SDK_INT < 23 || Settings.canDrawOverlays(c));
                  boolean fs = true;
                  if (Build.VERSION.SDK_INT >= 34) {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      fs = nm.canUseFullScreenIntent();
                  }
                  r.put("fullScreen", fs);
                  boolean bat = true;
                  if (Build.VERSION.SDK_INT >= 23) {
                      PowerManager pm = (PowerManager) c.getSystemService(Context.POWER_SERVICE);
                      bat = pm.isIgnoringBatteryOptimizations(c.getPackageName());
                  }
                  r.put("battery", bat);
                  call.resolve(r);
              }

              @PluginMethod
              public void openSettings(PluginCall call) {
                  String type = call.getString("type", "");
                  String pkg = getContext().getPackageName();
                  try {
                      Intent in = null;
                      if ("overlay".equals(type)) {
                          in = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + pkg));
                      } else if ("exact".equals(type)) {
                          if (Build.VERSION.SDK_INT >= 31) {
                              in = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse("package:" + pkg));
                          }
                      } else if ("fullscreen".equals(type)) {
                          if (Build.VERSION.SDK_INT >= 34) {
                              in = new Intent("android.settings.MANAGE_APP_USE_FULL_SCREEN_INTENT", Uri.parse("package:" + pkg));
                          }
                      } else if ("battery".equals(type)) {
                          in = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + pkg));
                      } else if ("notif".equals(type)) {
                          SharedPreferences sp = getContext().getSharedPreferences(AdhanScheduler.PREF, Context.MODE_PRIVATE);
                          boolean asked = sp.getBoolean("np_asked", false);
                          if (Build.VERSION.SDK_INT >= 33 && !asked) {
                              sp.edit().putBoolean("np_asked", true).apply();
                              ActivityCompat.requestPermissions(getActivity(), new String[]{Manifest.permission.POST_NOTIFICATIONS}, 4711);
                          } else {
                              in = new Intent(Settings.ACTION_APP_NOTIFICATION_SETTINGS);
                              in.putExtra(Settings.EXTRA_APP_PACKAGE, pkg);
                          }
                      }
                      if (in != null) getActivity().startActivity(in);
                      call.resolve();
                  } catch (Exception e) {
                      try {
                          Intent d = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + pkg));
                          getActivity().startActivity(d);
                      } catch (Exception e2) { }
                      call.resolve();
                  }
              }
          }
          JAVA_5
          cat > $D/AdhanNotif.java <<'JAVA_6'
          package com.murhaf.meeqat;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;

          final class AdhanNotif {
              static final String CH = "meeqat_notes";

              private AdhanNotif() {}

              static void channel(Context c) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm.getNotificationChannel(CH) == null) {
                          NotificationChannel ch = new NotificationChannel(CH, "تنبيهات الصلاة", NotificationManager.IMPORTANCE_HIGH);
                          ch.setSound(null, null);
                          ch.enableVibration(true);
                          ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          nm.createNotificationChannel(ch);
                      }
                  }
              }

              static int idFor(String kind, String key, String day, String sub) {
                  String s = kind + "|" + key + "|" + day + "|" + sub;
                  return 6000 + Math.abs(s.hashCode() % 90000);
              }

              static void post(Context c, int id, String title, String body) {
                  try {
                      channel(c);
                      Intent open = new Intent(c, MainActivity.class);
                      open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                      PendingIntent pi = PendingIntent.getActivity(c, id, open, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                      String b = body == null ? "" : body;
                      Notification n = new NotificationCompat.Builder(c, CH)
                              .setSmallIcon(R.drawable.ic_stat_meeqat)
                          .setColor(0xFF0B5D49)
                              .setContentTitle(title)
                              .setContentText(b)
                              .setStyle(new NotificationCompat.BigTextStyle().bigText(b))
                              .setAutoCancel(true)
                              .setCategory(NotificationCompat.CATEGORY_REMINDER)
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                              .setContentIntent(pi)
                              .build();
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.notify(id, n);
                  } catch (Exception e) { }
              }
          }
          JAVA_6
      - name: Android manifest (permissions, receivers, service)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p,encoding='utf-8').read()
          perms=['ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','POST_NOTIFICATIONS','USE_FULL_SCREEN_INTENT','USE_EXACT_ALARM','WAKE_LOCK','FOREGROUND_SERVICE','FOREGROUND_SERVICE_MEDIA_PLAYBACK','RECEIVE_BOOT_COMPLETED','SYSTEM_ALERT_WINDOW','REQUEST_IGNORE_BATTERY_OPTIMIZATIONS','VIBRATE']
          add=''.join('    <uses-permission android:name="android.permission.%s" />\n'%x for x in perms)
          add+='    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n'
          add+='    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n'
          comp="""        <receiver android:name=".AdhanReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.TIME_SET" />
                          <action android:name="android.intent.action.TIMEZONE_CHANGED" />
                      </intent-filter>
                  </receiver>
                  <service android:name=".AdhanService" android:exported="false" android:foregroundServiceType="mediaPlayback" />
          """
          assert '<application' in s and '</application>' in s
          s=s.replace('<application',add+'    <application',1)
          s=s.replace('</application>',comp+'    </application>',1)
          open(p,'w',encoding='utf-8').write(s)
          print(s)
          PY
      - name: Adhan sounds into the app (res/raw)
        run: |
          python3 - <<'PY'
          import re,base64,os
          s=open('www/index.html',encoding='utf-8').read()
          i=s.index('const ADH=');j=s.index('};',i)
          os.makedirs('android/app/src/main/res/raw',exist_ok=True)
          n=0
          for m in re.finditer(r'"((?:a|p)_[a-z0-9_]+)":"data:audio/([a-z0-9.+-]+);base64,([A-Za-z0-9+/=]+)"',s[i:j]):
              ext={'mpeg':'mp3','mp3':'mp3','ogg':'ogg','wav':'wav','x-wav':'wav','mp4':'m4a','aac':'aac'}.get(m.group(2),'mp3')
              open('android/app/src/main/res/raw/%s.%s'%(m.group(1),ext),'wb').write(base64.b64decode(m.group(3)));n+=1
          print('sounds extracted:',n)
          assert n>0
          PY
