          package com.murhaf.meeqat;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.widget.RemoteViews;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class TodayWidget extends AppWidgetProvider {

              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] ids) {
                  refresh(context, manager, ids);
              }

              static void refreshAll(Context c) {
                  try {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, TodayWidget.class));
                      if (ids != null && ids.length > 0) refresh(c, m, ids);
                  } catch (Exception e) { }
              }

              static void refresh(Context c, AppWidgetManager m, int[] ids) {
                  RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.widget_today);
                  int[] rIds = {R.id.d_r0, R.id.d_r1, R.id.d_r2, R.id.d_r3, R.id.d_r4, R.id.d_r5};
                  int[] nIds = {R.id.d_n0, R.id.d_n1, R.id.d_n2, R.id.d_n3, R.id.d_n4, R.id.d_n5};
                  int[] tIds = {R.id.d_t0, R.id.d_t1, R.id.d_t2, R.id.d_t3, R.id.d_t4, R.id.d_t5};
                  long now = System.currentTimeMillis();
                  long nextT = 0;
                  try {
                      JSONObject root = new JSONObject(c.getSharedPreferences(PrayerWidget.PREF, Context.MODE_PRIVATE).getString("data", "{}"));
                      JSONArray items = root.optJSONArray("items");
                      JSONArray days = root.optJSONArray("days");
                      String today = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date(now));
                      rv.setTextViewText(R.id.d_title, root.optString("today", "مواقيت اليوم"));

                      // the next prayer overall (may belong to tomorrow)
                      if (items != null) {
                          for (int i = 0; i < items.length(); i++) {
                              long t = items.getJSONObject(i).getLong("t");
                              if (t > now) {
                                  nextT = t;
                                  break;
                              }
                          }
                      }
                      String[] names = new String[6];
                      String[] times = new String[6];
                      long[] ts = new long[6];
                      boolean[] isPrayer = new boolean[6];
                      int[] slot = {0, 2, 3, 4, 5};
                      int k = 0;
                      if (items != null) {
                          for (int i = 0; i < items.length() && k < 5; i++) {
                              JSONObject it = items.getJSONObject(i);
                              if (!today.equals(it.optString("d"))) continue;
                              int s = slot[k];
                              names[s] = it.optString("n");
                              times[s] = it.optString("tm");
                              ts[s] = it.getLong("t");
                              isPrayer[s] = true;
                              k++;
                          }
                      }
                      if (days != null) {
                          for (int i = 0; i < days.length(); i++) {
                              JSONObject dy = days.getJSONObject(i);
                              if (today.equals(dy.optString("d"))) {
                                  names[1] = root.optString("sun", "الشروق");
                                  times[1] = dy.optString("sr");
                                  ts[1] = dy.optLong("t", 0L);
                                  rv.setTextViewText(R.id.d_date, dy.optString("lbl"));
                              }
                          }
                      }
                      for (int r = 0; r < 6; r++) {
                          rv.setTextViewText(nIds[r], names[r] == null ? "" : names[r]);
                          rv.setTextViewText(tIds[r], times[r] == null ? "" : times[r]);
                          int color = Color.WHITE;
                          int bg = 0;
                          if (names[r] != null && ts[r] > 0 && ts[r] <= now) {
                              color = Color.parseColor("#80FFFFFF");
                          }
                          if (isPrayer[r] && ts[r] == nextT) {
                              color = Color.parseColor("#E3C07A");
                              bg = R.drawable.widget_row_hl;
                          }
                          rv.setTextColor(nIds[r], color);
                          rv.setTextColor(tIds[r], color);
                          rv.setInt(rIds[r], "setBackgroundResource", bg);
                      }
                  } catch (Exception e) { }

                  Intent open = new Intent(c, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pi = PendingIntent.getActivity(c, 79, open, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                  rv.setOnClickPendingIntent(R.id.d_root, pi);
                  m.updateAppWidget(ids, rv);
                  PrayerWidget.scheduleNext(c, nextT);
              }
          }
