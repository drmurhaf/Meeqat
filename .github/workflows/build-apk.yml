          package com.murhaf.meeqat;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;

          final class AdhanNotif {
              static final String CH = "meeqat_notes";

              private AdhanNotif() {}

              static void channel(Context c) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm.getNotificationChannel(CH) == null) {
                          NotificationChannel ch = new NotificationChannel(CH, "تنبيهات الصلاة", NotificationManager.IMPORTANCE_HIGH);
                          ch.setSound(null, null);
                          ch.enableVibration(true);
                          ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                          nm.createNotificationChannel(ch);
                      }
                  }
              }

              static int idFor(String kind, String key, String day, String sub) {
                  String s = kind + "|" + key + "|" + day + "|" + sub;
                  return 6000 + Math.abs(s.hashCode() % 90000);
              }

              static void post(Context c, int id, String title, String body) {
                  try {
                      channel(c);
                      Intent open = new Intent(c, MainActivity.class);
                      open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                      PendingIntent pi = PendingIntent.getActivity(c, id, open, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                      String b = body == null ? "" : body;
                      Notification n = new NotificationCompat.Builder(c, CH)
                              .setSmallIcon(R.drawable.ic_stat_meeqat)
                          .setColor(0xFF0B5D49)
                              .setContentTitle(title)
                              .setContentText(b)
                              .setStyle(new NotificationCompat.BigTextStyle().bigText(b))
                              .setAutoCancel(true)
                              .setCategory(NotificationCompat.CATEGORY_REMINDER)
                              .setPriority(NotificationCompat.PRIORITY_HIGH)
                              .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                              .setContentIntent(pi)
                              .build();
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      nm.notify(id, n);
                  } catch (Exception e) { }
              }
          }
