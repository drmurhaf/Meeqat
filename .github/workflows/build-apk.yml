      - name: Fixed signing and version
        run: |
          python3 - <<'PY'
          import re
          p='android/app/build.gradle'
          s=open(p).read()
          sign='''android {
              signingConfigs {
                  debug {
                      storeFile file("../../meeqat.jks")
                      storePassword "meeqat123"
                      keyAlias "meeqat"
                      keyPassword "meeqat123"
                  }
              }'''
          s=s.replace('android {',sign,1)
          s=re.sub(r'versionCode\s+\d+','versionCode ${{ github.run_number }}',s,count=1)
          open(p,'w').write(s)
          PY
      - name: Build debug APK
        working-directory: meeqat-apk/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: meeqat-apk
          path: meeqat-apk/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release (manual run, or [release] in the commit message)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ github.run_number }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "meeqat-$TAG.apk"
          if [ -n "$INPUT_NOTES" ]; then
            NOTES="$INPUT_NOTES"
          else
            NOTES="$(git log -1 --pretty=%B | sed 's/\[release\]//Ig' | sed -e 's/[[:space:]]*$//')"
          fi
          if [ -z "$NOTES" ]; then NOTES="تحديث جديد لتطبيق ميقات"; fi
          printf '%s\n' "$NOTES" > release-notes.txt
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" "meeqat-$TAG.apk" --title "ميقات $TAG" --notes-file release-notes.txt --target "$GITHUB_SHA"
