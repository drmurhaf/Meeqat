          package com.murhaf.meeqat;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.SystemClock;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class PrayerWidget extends AppWidgetProvider {
              static final String TICK = "com.murhaf.meeqat.WIDGET_TICK";
              static final String PREF = "meeqat_widget";

              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] ids) {
                  refresh(context, manager, ids);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (intent != null && TICK.equals(intent.getAction())) {
                      refreshAll(context);
                      TodayWidget.refreshAll(context);
                  }
              }

              static void saveData(Context c, String json) {
                  c.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putString("data", json).apply();
              }

              static void refreshAll(Context c) {
                  try {
                      AppWidgetManager m = AppWidgetManager.getInstance(c);
                      int[] ids = m.getAppWidgetIds(new ComponentName(c, PrayerWidget.class));
                      if (ids != null && ids.length > 0) refresh(c, m, ids);
                  } catch (Exception e) { }
              }

              static void refresh(Context c, AppWidgetManager m, int[] ids) {
                  RemoteViews rv = new RemoteViews(c.getPackageName(), R.layout.widget_prayer);
                  long now = System.currentTimeMillis();
                  long nextT = 0;
                  int[] nIds = {R.id.w_n0, R.id.w_n1, R.id.w_n2, R.id.w_n3, R.id.w_n4};
                  int[] tIds = {R.id.w_t0, R.id.w_t1, R.id.w_t2, R.id.w_t3, R.id.w_t4};
                  try {
                      JSONObject root = new JSONObject(c.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString("data", "{}"));
                      JSONArray items = root.optJSONArray("items");
                      int idx = -1;
                      if (items != null) {
                          for (int i = 0; i < items.length(); i++) {
                              if (items.getJSONObject(i).getLong("t") > now) {
                                  idx = i;
                                  break;
                              }
                          }
                      }
                      if (idx >= 0) {
                          JSONObject nx = items.getJSONObject(idx);
                          nextT = nx.getLong("t");
                          rv.setTextViewText(R.id.w_label, root.optString("next", "الصلاة القادمة"));
                          rv.setTextViewText(R.id.w_name, nx.optString("n"));
                          rv.setTextViewText(R.id.w_time, nx.optString("tm"));
                          rv.setChronometer(R.id.w_cd, SystemClock.elapsedRealtime() + (nextT - now), null, true);
                          if (Build.VERSION.SDK_INT >= 24) {
                              rv.setChronometerCountDown(R.id.w_cd, true);
                          }
                          String day = nx.optString("d");
                          int col = 0;
                          for (int i = 0; i < items.length() && col < 5; i++) {
                              JSONObject it = items.getJSONObject(i);
                              if (!day.equals(it.optString("d"))) continue;
                              int color = it.getLong("t") == nextT ? Color.parseColor("#E3C07A") : Color.parseColor("#B3FFFFFF");
                              rv.setTextViewText(nIds[col], it.optString("n"));
                              rv.setTextViewText(tIds[col], it.optString("tm"));
                              rv.setTextColor(nIds[col], color);
                              rv.setTextColor(tIds[col], color);
                              col++;
                          }
                      } else {
                          rv.setTextViewText(R.id.w_label, root.optString("next", "الصلاة القادمة"));
                          rv.setTextViewText(R.id.w_name, "افتح ميقات");
                          rv.setTextViewText(R.id.w_time, "");
                          rv.setChronometer(R.id.w_cd, SystemClock.elapsedRealtime(), null, false);
                      }
                  } catch (Exception e) { }

                  Intent open = new Intent(c, MainActivity.class);
                  open.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pi = PendingIntent.getActivity(c, 77, open, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                  rv.setOnClickPendingIntent(R.id.w_root, pi);
                  m.updateAppWidget(ids, rv);
                  scheduleNext(c, nextT);
              }

              static void scheduleNext(Context c, long t) {
                  try {
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      Intent in = new Intent(c, PrayerWidget.class);
                      in.setAction(TICK);
                      int imm = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                      PendingIntent pi = PendingIntent.getBroadcast(c, 78, in, PendingIntent.FLAG_UPDATE_CURRENT | imm);
                      if (t <= 0) {
                          t = System.currentTimeMillis() + 24L * 3600L * 1000L;
                      }
                      long at = t + 1500L;
                      java.util.Calendar mid = java.util.Calendar.getInstance();
                      mid.add(java.util.Calendar.DAY_OF_YEAR, 1);
                      mid.set(java.util.Calendar.HOUR_OF_DAY, 0);
                      mid.set(java.util.Calendar.MINUTE, 0);
                      mid.set(java.util.Calendar.SECOND, 5);
                      mid.set(java.util.Calendar.MILLISECOND, 0);
                      if (mid.getTimeInMillis() < at) at = mid.getTimeInMillis();
                      if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                      } else {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                      }
                  } catch (Exception e) { }
              }
          }
