name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meeqat-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Native adhan (Java sources)
        run: |
          D=android/app/src/main/java/com/murhaf/meeqat
          mkdir -p $D
          cat > $D/MainActivity.java <<'JAVA_0'
          package com.murhaf.meeqat;

          import android.app.KeyguardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static MainActivity inst;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable releaseTask = new Runnable() {
                  @Override
                  public void run() {
                      endAdhanScreen();
                  }
              };
              private boolean adhanScreen = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AdhanPlugin.class);
                  super.onCreate(savedInstanceState);
                  inst = this;
                  applyAdhanFlags(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  applyAdhanFlags(intent);
              }

              @Override
              public void onStart() {
                  super.onStart();
                  getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(releaseTask);
                  if (inst == this) inst = null;
                  super.onDestroy();
              }

              /** Called when the adhan sound ends or is stopped: lets the screen turn off again. */
              static void releaseAdhanScreen() {
                  final MainActivity a = inst;
                  if (a == null) return;
                  a.runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          a.endAdhanScreen();
                      }
                  });
              }

              private void applyAdhanFlags(Intent intent) {
                  if (intent != null && intent.getBooleanExtra("adhan", false)) {
                      adhanScreen = true;
                      if (Build.VERSION.SDK_INT >= 27) {
                          setShowWhenLocked(true);
                          setTurnScreenOn(true);
                      } else {
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                                  | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                      }
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      // safety net in case the service is killed before it reports the end of the sound
                      handler.removeCallbacks(releaseTask);
                      handler.postDelayed(releaseTask, 10 * 60 * 1000L);
                  }
              }

              private void endAdhanScreen() {
                  if (!adhanScreen) return;
                  adhanScreen = false;
                  handler.removeCallbacks(releaseTask);
                  try {
                      getIntent().removeExtra("adhan");
                  } catch (Exception e) { }
                  try {
                      getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      if (Build.VERSION.SDK_INT >= 27) {
                          setTurnScreenOn(false);
                          setShowWhenLocked(false);
                      } else {
                          getWindow().clearFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                                  | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                      }
                      KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);
                      if (km != null && km.isKeyguardLocked()) {
                          // phone was locked: send the app away so the screen can time out by itself
                          moveTaskToBack(true);
                      }
                  } catch (Exception e) { }
              }
          }
          JAVA_0
          cat > $D/AdhanScheduler.java <<'JAVA_1'
          package com.murhaf.meeqat;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;

          final class AdhanScheduler {
              static final String PREF = "meeqat_adhan";
              static final String ACTION = "com.murhaf.meeqat.ADHAN";

              private AdhanScheduler() {}

              static void save(Context c, String json) {
                  c.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putString("items", json).apply();
              }

              static void setDone(Context c, String json) {
                  c.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit().putString("done", json).apply();
              }

              static boolean isDone(Context c, String day, String key) {
                  try {
                      JSONArray a = new JSONArray(c.getSharedPreferences(PREF, Context.MODE_PRIVATE).getString("done", "[]"));
                      String k = day + "|" + key;
                      for (int i = 0; i < a.length(); i++) {
                          if (k.equals(a.getString(i))) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              static boolean canExact(Context c) {
                  if (Build.VERSION.SDK_INT >= 31) {
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      return am.canScheduleExactAlarms();
                  }
                  return true;
              }

              private static int flags() {
                  int f = PendingIntent.FLAG_UPDATE_CURRENT;
                  if (Build.VERSION.SDK_INT >= 23) f |= PendingIntent.FLAG_IMMUTABLE;
                  return f;
              }

              private static Intent baseIntent(Context c) {
                  Intent in = new Intent(c, AdhanReceiver.class);
                  in.setAction(ACTION);
                  return in;
              }

              private static int subIdx(String kind, String sub) {
                  if ("adhan".equals(kind)) return 0;
                  if ("pre".equals(kind)) return 1;
                  if ("a20".equals(sub)) return 2;
                  if ("a60".equals(sub)) return 3;
                  if ("e10".equals(sub)) return 4;
                  return 5;
              }

              static void cancelAll(Context c) {
                  try {
                      SharedPreferences sp = c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                      JSONArray codes = new JSONArray(sp.getString("codes", "[]"));
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      for (int i = 0; i < codes.length(); i++) {
                          try {
                              PendingIntent pi = PendingIntent.getBroadcast(c, codes.getInt(i), baseIntent(c), flags());
                              am.cancel(pi);
                          } catch (Exception e) { }
                      }
                      sp.edit().putString("codes", "[]").apply();
                  } catch (Exception e) { }
              }

              static int scheduleAll(Context c) {
                  cancelAll(c);
                  int n = 0;
                  try {
                      SharedPreferences sp = c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
                      JSONArray items = new JSONArray(sp.getString("items", "[]"));
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      long now = System.currentTimeMillis();
                      JSONArray codes = new JSONArray();
                      for (int i = 0; i < items.length(); i++) {
                          try {
                              JSONObject o = items.getJSONObject(i);
                              long t = o.getLong("t");
                              if (t <= now + 1000) continue;
                              String kind = o.optString("kind", "adhan");
                              String sub = o.optString("sub", "");
                              int code = (int) (((t / 60000L) * 16L + subIdx(kind, sub)) & 0x7fffffffL);
                              Intent in = baseIntent(c);
                              in.putExtra("key", o.optString("key"));
                              in.putExtra("name", o.optString("name"));
                              in.putExtra("sound", o.optString("sound"));
                              in.putExtra("kind", kind);
                              in.putExtra("sub", sub);
                              in.putExtra("day", o.optString("day"));
                              in.putExtra("title", o.optString("title"));
                              in.putExtra("body", o.optString("body"));
                              PendingIntent pi = PendingIntent.getBroadcast(c, code, in, flags());
                              if ("adhan".equals(kind)) {
                                  PendingIntent show = PendingIntent.getActivity(c, code, new Intent(c, MainActivity.class), flags());
                                  am.setAlarmClock(new AlarmManager.AlarmClockInfo(t, show), pi);
                              } else {
                                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi);
                              }
                              codes.put(code);
                              n++;
                          } catch (Exception e) { }
                      }
                      sp.edit().putString("codes", codes.toString()).apply();
                  } catch (Exception e) { }
                  return n;
              }
          }
          JAVA_1
          cat > $D/AdhanReceiver.java <<'JAVA_2'
          package com.murhaf.meeqat;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          public class AdhanReceiver extends BroadcastReceiver {
              private static String s(Intent i, String k) {
                  String v = i.getStringExtra(k);
                  return v == null ? "" : v;
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      String kind = s(intent, "kind");
                      if (kind.isEmpty()) kind = "adhan";
                      String key = s(intent, "key");
                      String day = s(intent, "day");
                      String sub = s(intent, "sub");
                      String sound = s(intent, "sound");
                      String title = s(intent, "title");
                      String body = s(intent, "body");
                      if (title.isEmpty()) title = "حان وقت صلاة " + s(intent, "name");

                      if ("post".equals(kind) && AdhanScheduler.isDone(context, day, key)) return;

                      if (sound.isEmpty() || "off".equals(sound)) {
                          AdhanNotif.post(context, AdhanNotif.idFor(kind, key, day, sub), title, body);
                          return;
                      }

                      Intent svc = new Intent(context, AdhanService.class);
                      if (intent.getExtras() != null) svc.putExtras(intent.getExtras());
                      svc.putExtra("kind", kind);
                      svc.putExtra("title", title);
                      if (Build.VERSION.SDK_INT >= 26) {
                          context.startForegroundService(svc);
                      } else {
                          context.startService(svc);
                      }
                  } catch (Exception e) { }
              }
          }
